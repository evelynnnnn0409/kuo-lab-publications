# Function: Automatically runs fetch_pubmed_bib.py every Monday and commits the updated kuo_sh.bib back to this repository.
name: Update PubMed Publications

on:
  schedule:
    - cron: '27 16 * * *'
#chicago 11:00 am everyday

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch PubMed publications
        run: python fetch_pubmed_bib.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kuo_sh.bib
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update PubMed research list"
          git push
